name: AI DevSecOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  pipeline:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
      with:
        fetch-depth: 2

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install pytest bandit httpx

    - name: Run tests (JUnit output)
      run: |
        mkdir -p test-results
        pytest tests/ --junitxml=test-results/junit.xml
      continue-on-error: true

    - name: Build Docker image (timed)
      run: |
        START=$(date +%s)
        docker build -t devsecops-ai:${{ github.sha }} .
        END=$(date +%s)
        echo "BUILD_TIME_SECONDS=$((END-START))" >> $GITHUB_ENV

    - name: Run Trivy vulnerability scan
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: 'devsecops-ai:${{ github.sha }}'
        format: 'json'
        output: 'trivy-report.json'
      continue-on-error: true

    - name: Run Bandit static analysis
      run: bandit -r . -f json -o bandit-report.json || true

    - name: Collect real metrics + run risk prediction
      run: python scripts/collect_metrics.py
      env:
        BUILD_TIME_SECONDS: ${{ env.BUILD_TIME_SECONDS }}

    - name: Append run to dataset
      run: python scripts/build_dataset.py

    - name: Upload pipeline artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ai-pipeline-results
        path: |
          metrics.json
          risk-decision.json
          dataset.csv
          trivy-report.json
          bandit-report.json
          test-results/junit.xml

    - name: Commit updated dataset
      run: |
        git config user.name "github-actions"
        git config user.email "actions@github.com"
        git add dataset.csv
        git diff --staged --quiet || git commit -m "Update dataset.csv [skip ci]"
        git push