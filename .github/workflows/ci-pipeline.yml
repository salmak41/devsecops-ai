name: AI DevSecOps Pipeline

on:
  push:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Install dependencies
      run: pip install -r requirements.txt
    
    - name: Run AI Risk Prediction
      run: |
        python -c "from model import calculate_risk; risk, decision = calculate_risk(0.9, 2, 120); print(f'Risk: {risk}, Decision: {decision}')"